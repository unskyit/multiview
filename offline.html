<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Offline — MultiView</title>
  <style>
    :root {
      color-scheme: dark light;
      --bg: #000000;
      --card: #0a0e17;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --border: #1e293b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Inter", Roboto, sans-serif;
      line-height: 1.5;
    }
    .card {
      max-width: 26rem;
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.75rem;
      text-align: center;
    }
    h1 { font-size: 1.15rem; font-weight: 700; margin: 0.75rem 0 0.5rem; }
    p { color: var(--muted); font-size: 0.9rem; margin-bottom: 1.25rem; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.65rem 1.25rem;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 0.88rem;
      border-radius: 0.625rem;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#60a5fa" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="margin: 0 auto;">
      <path d="M12 2v20M2 12h20"/>
    </svg>
    <h1>Offline Mode Ready</h1>
    <p>MultiView runs locally on your device. Launch the cached application shell to open any local photo, video, audio track, PDF, or document.</p>
    <a class="btn" href="./index.html">Open MultiView</a>
  </main>
</body>
</html>
